<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Happy Birthday</title>

    <link rel="stylesheet" href="style.css">

    <script src="lib/jquery.min.js"></script>
    <script src="lib/jscex.min.js"></script>
    <script src="lib/jscex-parser.js"></script>
    <script src="lib/jscex-jit.js"></script>
    <script src="lib/jscex-builderbase.min.js"></script>
    <script src="lib/jscex-async.min.js"></script>
    <script src="lib/jscex-async-powerpack.min.js"></script>

    <script src="functions.js"></script>
    <script src="love.js"></script>
</head>

<body>

    <div id="main">

        <div id="error">
            Your browser does not support HTML5 Canvas.
        </div>

        <div id="wrap">

            <div id="text">

                <div id="code">

                    <span class="say">Hey you 💕</span><br>

                    <span class="say">Happy Birthday 🎂</span><br>

                    <span class="say">May God bless you 🌷</span><br>

                    <span class="say">And give u many happiness ❤️</span><br>

                    <span class="say">Just saying... you're pretty awesome 💞</span><br>

                    <span class="say">Sending good vibes and maybe a wink 😉</span><br>

                    <span class="say">Hope u have a great day today 💖</span><br>

                </div>

            </div>

            <div id="clock-box">
                <span id="clock"></span>
            </div>

            <canvas id="canvas" width="1100" height="680"></canvas>

        </div>

    </div>

</body>

</html>
