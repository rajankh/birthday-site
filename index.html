    <title>Happy Birthday</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="wrap">

        <div id="text">
            <div id="code">

                <span class="say">Hey you 💕</span><br>
                <span class="say">Happy Birthday 🎂</span><br>
                <span class="say">May God bless you 🌷</span><br>
                <span class="say">And give u many happiness ❤️</span><br>
                <span class="say">Just saying... you're pretty awesome 💞</span><br>
                <span class="say">Sending good vibes and maybe a wink 😉</span><br>
                <span class="say">Hope u have a great day today 💖</span><br>

            </div>
        </div>

        <div id="clock-box">
            <span id="clock"></span>
        </div>

        <canvas id="canvas"></canvas>

    </div>
